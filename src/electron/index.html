<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://payments.codeups.jp https://docs.opencv.org https://tessdata.projectnaptha.com https://cdn.jsdelivr.net https://cdn.jsdelivr.net/npm/* https://cdn.jsdelivr.net/npm/@tesseract.js-data/* https://unpkg.com https://unpkg.com/* data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://unpkg.com https://cdn.jsdelivr.net https://docs.opencv.org; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://unpkg.com https://cdn.jsdelivr.net https://docs.opencv.org; worker-src 'self' blob: data: https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; media-src 'self'; object-src 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- sass.js CDN - 最初に読み込む -->
  <script src="https://cdn.jsdelivr.net/npm/sass.js@0.11.1/dist/sass.sync.min.js" defer></script>
  <!-- Tesseract.js CDN -->
  <script src="https://unpkg.com/tesseract.js@5.0.4/dist/tesseract.min.js" defer></script>
  <!-- OpenCV.js初期化コールバック -->
  <script>
    window.Module = {
      onRuntimeInitialized() {
        console.log('OpenCV.js ランタイム初期化完了');
        window.cvReady = true;
        if (window.cv && window.cv.Mat) {
          console.log('OpenCV.js が正常に利用可能です');
          // WebAssembly Image Analyzerの初期化を促す
          setTimeout(() => {
            if (window.webAssemblyAnalyzer) {
              console.log('WebAssembly Analyzer が利用可能です');
            } else {
              console.warn('WebAssembly Analyzer が読み込まれていません');
            }
          }, 1000);
        }
      }
    };
  </script>
  <!-- OpenCV.js ローカルから読み込み -->
  <script src="/opencv.js"></script>
  <!-- WebAssembly Image Analyzer をHTMLスクリプトとして読み込み（OpenCV.js後） -->
  <script src="/webassembly-image-analyzer.js" onload="console.log('✅ webassembly-image-analyzer.js loaded')" onerror="console.error('❌ webassembly-image-analyzer.js loading failed')"></script>
  <title>CreAIteCode - HTMLコード生成ツール</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Node.jsモジュールをブラウザで使用できるようにするスクリプト -->
  <script>
    // contextIsolationが有効な場合でもNodeモジュールにアクセスするためのヘルパー
    function checkElectronAvailability() {
      console.log('Electronの可用性をチェックしています...');
      if (window.electron) {
        console.log('Electron API が見つかりました');
        return true;
      } else {
        console.log('Electron API が見つかりません');
        return false;
      }
    }

    // APIインターフェースの検証
    function validateAPI() {
      console.log('API インターフェースを検証しています...');
      if (window.api) {
        console.log('window.api が見つかりました:', Object.keys(window.api));
        return true;
      } else {
        console.log('window.api が見つかりません。フォールバックをセットアップします...');
        return false;
      }
    }

    // Sass.jsのロードチェック
    function checkSassAvailability() {
      console.log('Sass.jsの可用性をチェックしています...');
      if (window.Sass) {
        console.log('Sass.js が正常に読み込まれました');
        return true;
      } else {
        console.error('Sass.js が読み込まれていません');
        return false;
      }
    }

    // OpenCV.jsのロードチェック
    function checkOpenCVAvailability() {
      console.log('OpenCV.jsの可用性をチェックしています...');
      const status = {
        'window.cv': typeof window.cv,
        'window.cv.Mat': window.cv ? typeof window.cv.Mat : 'undefined',
        'window.cv.imread': window.cv ? typeof window.cv.imread : 'undefined',
        'window.cvReady': window.cvReady
      };
      console.log('OpenCV状態:', status);

      if (window.cv && window.cv.Mat && typeof window.cv.imread === 'function') {
        console.log('OpenCV.js が正常に読み込まれました');
        return true;
      } else {
        console.error('OpenCV.js が読み込まれていません');
        return false;
      }
    }

    // ページ読み込み完了時に実行
    window.addEventListener('DOMContentLoaded', () => {
      console.log('ページが読み込まれました');
      checkElectronAvailability();
      validateAPI();
      checkSassAvailability();

      // WebAssembly環境の初期化確認（段階的チェック）
      const checkWebAssemblyEnvironment = () => {
        console.log('🔍 WebAssembly環境チェック開始');
        checkOpenCVAvailability();
        console.log('🔍 window.webAssemblyAnalyzer存在確認:', typeof window.webAssemblyAnalyzer);
        console.log('🔍 window.webAssemblyAnalyzerReady:', window.webAssemblyAnalyzerReady);
        console.log('🔍 window.Tesseract存在確認:', typeof window.Tesseract);
        console.log('🔍 window.cv存在確認:', typeof window.cv);

        // analyzeAll関数の存在確認
        if (window.webAssemblyAnalyzer && window.webAssemblyAnalyzer.analyzeAll) {
          console.log('✅ webAssemblyAnalyzer.analyzeAll 利用可能');
        } else {
          console.log('❌ webAssemblyAnalyzer.analyzeAll 利用不可');
        }
      };

      setTimeout(checkWebAssemblyEnvironment, 2000);
      setTimeout(checkWebAssemblyEnvironment, 5000);
      setTimeout(checkWebAssemblyEnvironment, 10000);
    });
  </script>
</head>
<body>
  <h1 style="display: none;">CreAIteCode</h1>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
